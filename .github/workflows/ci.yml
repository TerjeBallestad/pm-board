name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Testcontainers starts Postgres in the runner's Docker.
      - run: dotnet test server/PmBoard.slnx

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx tsc -p tsconfig.json
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: node --test shared/glossary.test.mjs

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pm_board
          POSTGRES_PASSWORD: pm_board
          POSTGRES_DB: pm_board
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pm_board" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet build server/PmBoard.slnx
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run build
        working-directory: client
      # e2e/stack.mjs wipes this database, imports e2e/fixture.json, and serves client/dist.
      - run: npm run e2e
        working-directory: client
        env:
          E2E_PG: postgres://pm_board:pm_board@localhost:5432/pm_board
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

  # tools/compare-write.mjs: one script of writes against 0.x (the npm package) and 1.x, compared
  # after every step. It imports its fixture under a new slug and starts its own server.
  golden-write:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pm_board
          POSTGRES_PASSWORD: pm_board
          POSTGRES_DB: pm_board
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pm_board" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: dotnet build server/PmBoard.slnx
      - run: npm ci
        working-directory: tools
      - run: node tools/compare-write.mjs
        env:
          PMB_PG: postgres://pm_board:pm_board@localhost:5432/pm_board
      # The 1.x CLI: its copies of shared/ are current, and every command prints what 0.x prints.
      - run: npm test
        working-directory: cli
      - run: node tools/compare-cli.mjs
        env:
          PMB_PG: postgres://pm_board:pm_board@localhost:5432/pm_board
      # The exporter for pm-data: 0.x reads the export as the board the server serves (DD-022).
      - run: node tools/compare-export.mjs
        env:
          PMB_PG: postgres://pm_board:pm_board@localhost:5432/pm_board

  image:
    needs: [server, client, e2e, golden-write]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/terjeballestad/pm-board:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
